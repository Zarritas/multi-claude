name: Release

# Pushing a v* tag is the whole trigger: the tag is what hatch-vcs turns into the version,
# so anything that reacted to a branch instead would build an artefact that calls itself
# a dev snapshot.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # creating the release, and nothing else

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs needs the tags, and shallow clones have none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Before building anything: a tag with no CHANGELOG section is a mistake to stop,
      # not a release to publish with empty notes. The script exits 1 and says how to fix it.
      - name: Extract the release notes
        run: |
          python tools/release_notes.py "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
          echo "--- notes for ${GITHUB_REF_NAME} ---"
          cat "${RUNNER_TEMP}/notes.md"

      # The CI workflow gates pushes to main and PRs, but nothing stops a tag from landing
      # on a commit it never saw. A release is the last place to find that out from a user.
      - name: Run the checks
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          mypy src/multi_claude
          pytest -q

      - name: Build the wheel and the sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      # If hatch-vcs did not see the tag (a shallow checkout, a tag pushed without its
      # commit), the artefact would be named 1.0.0.devN and the release would be lying
      # about what it ships. Cheaper to fail here than to have someone install it.
      - name: Check the built version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | head -1 | sed -E 's|.*/multi_claude-([^-]+)-.*|\1|')
          echo "tag=${expected} built=${built}"
          if [ "${built}" != "${expected}" ]; then
            echo "::error::the build produced ${built} but the tag says ${expected}" >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            dist/*
