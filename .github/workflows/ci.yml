name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # bash everywhere, Windows included (it has Git Bash): the Pytest step below is a shell
    # pipeline with `tee`, `grep` and `pipefail`, and the default shell on Windows runners is
    # PowerShell, where none of that parses.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # The classifiers promise Linux, macOS and Windows, and launcher.py and focus.py are
        # ~1.200 lines of platform-specific code — osascript, wt.exe, xdotool — that only
        # Linux was ever exercising. Not the full grid: every Python on Linux, because that
        # is where the version differences showed up, plus one job per other OS, because
        # what those catch is "does it import and does the platform code hold", not a
        # version difference. A full 3x3 would triple the bill for the same information.
        include:
          - {os: ubuntu-latest, python-version: "3.10"}
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs the tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/multi_claude
      - name: Pytest
        run: |
          set -o pipefail
          if ! pytest -q 2>&1 | tee "${RUNNER_TEMP}/pytest.log"; then
            # Surface the failures as annotations. Downloading a job log needs admin rights
            # on the repo, so without this a contributor — or anyone debugging from outside —
            # can see that CI went red but not what broke, which is most of the information.
            grep -E "^(FAILED|ERROR)" "${RUNNER_TEMP}/pytest.log" | head -20 | while read -r l; do
              echo "::error::${l}"
            done
            exit 1
          fi
