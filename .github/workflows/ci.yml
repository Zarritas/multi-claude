name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs the tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/multi_claude
      - name: Pytest
        run: |
          set -o pipefail
          if ! pytest -q 2>&1 | tee "${RUNNER_TEMP}/pytest.log"; then
            # Surface the failures as annotations. Downloading a job log needs admin rights
            # on the repo, so without this a contributor — or anyone debugging from outside —
            # can see that CI went red but not what broke, which is most of the information.
            grep -E "^(FAILED|ERROR)" "${RUNNER_TEMP}/pytest.log" | head -20 | while read -r l; do
              echo "::error::${l}"
            done
            exit 1
          fi
